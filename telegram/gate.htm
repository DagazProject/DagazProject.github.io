<!-- Пост-инициализация -->
<script>
(function () {
    'use strict';

    var errorsEl = document.getElementById('errors');
    window.addEventListener('error', function (e) {
        errorsEl.style.display = 'block';
        errorsEl.textContent += '❌ ' + (e.message || e.error) + '\n';
    });

    /* ── Диалоги Telegram с проверкой версии Bot API ─────────── */
    function tgVersionAtLeast(v) {
        if (!window.Telegram || !Telegram.WebApp) return false;
        var cur = parseFloat(Telegram.WebApp.version || '0');
        return cur >= v;
    }

    var _alert   = window.alert.bind(window);
    var _confirm = window.confirm.bind(window);

    window.alert = function (msg) {
        // showAlert доступен только с Bot API 6.2
        if (tgVersionAtLeast(6.2) && Telegram.WebApp.showAlert) {
            try { Telegram.WebApp.showAlert(String(msg)); return; }
            catch (e) { console.warn('showAlert failed, fallback to native:', e); }
        }
        _alert(msg);
    };

    window.confirm = function (msg) {
        // showConfirm доступен только с Bot API 6.2
        if (tgVersionAtLeast(6.2) && Telegram.WebApp.showConfirm) {
            try {
                // Синхронного confirm в Telegram нет — показываем нативный
                return _confirm(msg);
            } catch (e) { /* fallback */ }
        }
        return _confirm(msg);
    };

    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function () { return null; };
    if (Dagaz.Controller) {
        Dagaz.Controller.go = function () {};
    }
})();
</script>
