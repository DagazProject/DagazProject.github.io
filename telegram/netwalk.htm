<!-- ========== Инициализация Telegram + диагностика ========== -->
<script>
(function() {
    'use strict';

    // 1. Инициализация Telegram WebApp
    if (window.Telegram && Telegram.WebApp) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor('#1a1a2e');
            Telegram.WebApp.setBackgroundColor('#1a1a2e');
        } catch (_) {}
    }

    // 2. Заменяем alert на нативный диалог Telegram
    var _alert = window.alert;
    window.alert = function(msg) {
        if (window.Telegram?.WebApp?.showAlert) {
            Telegram.WebApp.showAlert(String(msg));
        } else {
            _alert(msg);
        }
    };

    // 3. Отключаем авто-переходы при победе
    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function() { return null; };

    // 4. Диагностика: собираем ошибки и показываем на странице
    var errorsEl = document.getElementById('errors');
    function showError(msg) {
        errorsEl.style.display = 'block';
        errorsEl.textContent += msg + '\n';
    }
    window.addEventListener('error', function(e) {
        showError('❌ ' + (e.message || e.error) +
                  (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function(e) {
        showError('❌ Promise: ' + (e.reason && e.reason.message || e.reason));
    });

    // 5. Проверяем, что все изображения реально загрузились
    var imgs = document.querySelectorAll('img');
    var broken = [];
    imgs.forEach(function(img) {
        img.addEventListener('error', function() {
            broken.push(img.id || img.src);
            showError('🖼️ 404: ' + img.src);
        });
    });

    // 6. Прячем «Загрузка…», когда канвас что-то отрисовал
    var loadingEl = document.getElementById('loading');
    var checks = 0;
    var iv = setInterval(function() {
        // если движок инициализировался и холст получил контент
        if (window.Dagaz && Dagaz.Controller && Dagaz.Controller.app &&
            Dagaz.Controller.app.view && Dagaz.Controller.app.view.allDone) {
            loadingEl.classList.add('hide');
            clearInterval(iv);
        }
        // через 8 секунд принудительно скрываем, чтобы не висело вечно
        if (++checks > 80) {
            loadingEl.classList.add('hide');
            clearInterval(iv);
        }
    }, 100);
})();
</script>
