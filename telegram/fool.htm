    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #e8e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            overscroll-behavior: contain;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 10px 20px;
            gap: 10px;
            min-height: 100vh;
        }
        .center-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .canvas-wrap {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
        }
        .cc2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .cc2 a {
            color: #8ab4f8;
            text-decoration: none;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .cc2 a:hover {
            background: #2d3561;
        }
        #Canvas {
            width: 100%;
            max-width: 572px;
            height: auto;
            display: block;
            border-radius: 10px;
            background: #000;
            image-rendering: pixelated;
            box-shadow: 0 4px 20px rgba(0,0,0,.5);
            touch-action: none;
        }
        /* скрываем стандартные стрелки, если они вдруг появятся */
        .dpad, #controls { display: none !important; }
    </style>
</head>

<!-- ========== Инициализация Telegram ========== -->
<script>
(function() {
    'use strict';

    // Telegram WebApp
    if (window.Telegram && Telegram.WebApp) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor('#1a1a2e');
            Telegram.WebApp.setBackgroundColor('#1a1a2e');
        } catch (_) {}
    }

    // Заменяем alert на нативный диалог Telegram
    var _alert = window.alert;
    window.alert = function(msg) {
        if (window.Telegram?.WebApp?.showAlert) {
            Telegram.WebApp.showAlert(String(msg));
        } else {
            _alert(msg);
        }
    };

    // Отключаем авто-переходы при победе (чтобы игра не пыталась уйти на другой URL)
    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function() { return null; };
})();
</script>
