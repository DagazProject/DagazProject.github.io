<!-- ========== Инициализация Telegram и запуск ========== -->
<script>
(function() {
    'use strict';

    // 1. Инициализация Telegram WebApp
    if (window.Telegram && Telegram.WebApp) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor('#1a1a2e');
            Telegram.WebApp.setBackgroundColor('#1a1a2e');
        } catch (_) {}
    }

    // 2. Заменяем alert на нативный диалог Telegram
    var _alert = window.alert;
    window.alert = function(msg) {
        if (window.Telegram?.WebApp?.showAlert) {
            Telegram.WebApp.showAlert(String(msg));
        } else {
            _alert(msg);
        }
    };

    // 3. Отключаем авто-переходы при победе
    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function() { return null; };

    // 4. Переопределяем newGame для использования нативного confirm в Telegram
    var _newGame = Dagaz.Controller.newGame;
    Dagaz.Controller.newGame = function() {
        if (window.Telegram?.WebApp?.showConfirm) {
            Telegram.WebApp.showConfirm('Начать новую игру?', function(ok) {
                if (ok) _newGame.call(Dagaz.Controller);
            });
        } else {
            _newGame.call(Dagaz.Controller);
        }
    };
})();
</script>
