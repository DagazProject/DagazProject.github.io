    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            background: #1a1a2e;
            color: #e8e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overscroll-behavior: contain;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 10px 20px;
            gap: 8px;
        }
        .center-body { display: flex; justify-content: center; width: 100%; }
        .canvas-wrap { display: flex; justify-content: center; width: 100%; }
        .cc2 { display: flex; justify-content: center; width: 100%; }
        #Canvas {
            display: block;
            width: 100%;
            max-width: 480px;
            height: auto;
            border-radius: 10px;
            background: #ffffff;
            image-rendering: pixelated;
            box-shadow: 0 4px 20px rgba(0,0,0,.4);
            touch-action: manipulation;
        }
        /* Скрытые служебные элементы для session-manager.js */
        #undo, #redo, #sound { display: none !important; }
        #errors {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 10px;
            background: #4a1a1a;
            border: 1px solid #a44;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #ffb0b0;
        }
    </style>
</head>

})();

<!-- ========== Пост-инициализация: диалоги и отключение авто-переходов ========== -->
<script>
(function () {
    'use strict';

    var errorsEl = document.getElementById('errors');
    window.addEventListener('error', function (e) {
        errorsEl.style.display = 'block';
        errorsEl.textContent += '❌ ' + (e.message || e.error) + '\n';
    });

    /* Диалоги Telegram с проверкой версии Bot API */
    function tgVersionAtLeast(v) {
        if (!window.Telegram || !Telegram.WebApp) return false;
        return parseFloat(Telegram.WebApp.version || '0') >= v;
    }
    var _alert = window.alert.bind(window);
    window.alert = function (msg) {
        if (tgVersionAtLeast(6.2) && Telegram.WebApp.showAlert) {
            try { Telegram.WebApp.showAlert(String(msg)); return; }
            catch (e) { /* fallback */ }
        }
        _alert(msg);
    };

    /* Отключаем автоматические переходы при завершении игры */
    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function () { return null; };
    if (Dagaz.Controller) {
        Dagaz.Controller.go = function () {};
    }
})();
</script>
