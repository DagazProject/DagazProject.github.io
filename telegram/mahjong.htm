    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            background: #1a1a2e;
            color: #e8e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overscroll-behavior: contain;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }
        #Canvas {
            display: block;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,.4);
            touch-action: manipulation;
            image-rendering: pixelated;
        }
        /* Кнопки управления скрыты, но существуют в DOM для session-manager.js */
        #undo, #redo, #sound { display: none !important; }
        /* Панель ошибок для отладки */
        #errors {
            display: none;
            position: fixed;
            top: 10px; left: 10px; right: 10px;
            padding: 10px;
            background: #4a1a1a;
            border: 1px solid #a44;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #ffb0b0;
            z-index: 100;
        }
    </style>
</head>

<!-- ========== Инициализация Telegram ДО app.js ========== -->
<script>
(function () {
    if (window.Telegram && Telegram.WebApp) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        } catch (_) {}
    }
})();
</script>

<script src="https://dagazproject.github.io/common-scripts/app.js"></script>

<!-- ========== Пост-инициализация: диалоги и отключение авто-переходов ========== -->
<script>
(function () {
    'use strict';

    // Диагностика
    var errorsEl = document.getElementById('errors');
    window.addEventListener('error', function (e) {
        errorsEl.style.display = 'block';
        errorsEl.textContent += '❌ ' + (e.message || e.error) + '\n';
    });

    // Заменяем alert на нативный диалог Telegram
    var _alert = window.alert;
    window.alert = function (msg) {
        if (window.Telegram?.WebApp?.showAlert) {
            Telegram.WebApp.showAlert(String(msg));
        } else {
            _alert(msg);
        }
    };

    // Не уходим на другой URL при победе (для прогрессивных уровней)
    Dagaz.Model.progressive    = false;
    Dagaz.Model.progressiveUrl = null;
    Dagaz.Model.continue       = function () { return null; };
    if (Dagaz.Controller) {
        Dagaz.Controller.go = function () {};   // no-op
    }
})();
</script>
